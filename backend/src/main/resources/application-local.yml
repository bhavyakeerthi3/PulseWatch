server:
  address: 127.0.0.1
spring:
  datasource:
    url: jdbc:h2:file:./data/pulsewatch;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data.redis.repositories.enabled: false
  jpa:
    hibernate.ddl-auto: update
management:
  health:
    redis:
      enabled: false
