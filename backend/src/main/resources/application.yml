server:
  port: ${SERVER_PORT:8080}
spring:
  application.name: pulsewatch-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pulsewatch}
    username: ${DATABASE_USER:pulsewatch}
    password: ${DATABASE_PASSWORD:pulsewatch}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
management.endpoints.web.exposure.include: health,info,metrics
pulsewatch:
  collector:
    interval-ms: ${COLLECTOR_INTERVAL_MS:30000}
    timeout-ms: ${COLLECTOR_TIMEOUT_MS:3000}
    retries: ${COLLECTOR_RETRIES:1}
    retry-delay-ms: ${COLLECTOR_RETRY_DELAY_MS:250}
  alert:
    latency-threshold-ms: ${ALERT_LATENCY_THRESHOLD_MS:1500}
    down-incident-minutes: ${INCIDENT_AFTER_MINUTES:2}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:change-me}
logging.level.dev.pulsewatch: INFO
